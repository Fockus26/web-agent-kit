# The kit's reference CI. Copy to .github/workflows/ci.yml and adjust the framework's
# commands (typecheck) and the placeholder variables the build needs.
#
# It ALWAYS runs the full suite: the graph-based test selection (`bun run test:related`)
# is for the agent's local loop, it does not replace this.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml triggers it on the version PR's branch: that PR is opened by GITHUB_TOKEN and
  # does not fire `pull_request`, so without this it lacks the `ci` check main requires.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder values if the build creates clients on import (Supabase, etc.).
      # Never real secrets here. If a step needs one: `gh secret set <NAME>` and
      # `${{ secrets.<NAME> }}` (web-agent-kit reference/DEPLOY.md §2c).
      NEXT_PUBLIC_EXAMPLE_URL: https://placeholder.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck        # next typegen + tsc (Next 16 generates LayoutProps in .next/). Astro: bunx astro check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test             # the command lives in package.json (tests/unit, --pass-with-no-tests)

      - name: Build
        run: bun run build

  # optional e2e: the affected tests first (fast feedback), then everything.
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { fetch-depth: 0 }          # --only-changed needs the history
  #     - uses: oven-sh/setup-bun@v2
  #     - run: bun install --frozen-lockfile
  #     - run: bunx playwright install --with-deps chromium
  #     - run: bun run build
  #     - run: bunx playwright test --only-changed=origin/$GITHUB_BASE_REF
  #       if: github.event_name == 'pull_request'
  #     - run: bunx playwright test
